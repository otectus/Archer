name: CI

on:
  schedule:
    - cron: '27 4 * * *'
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  shellcheck:
    name: ShellCheck Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck
      - name: Run ShellCheck on all Bash scripts
        run: |
          find . -name '*.sh' -not -path './.git/*' | while read -r script; do
            echo "Checking $script..."
            shellcheck -x -s bash "$script" || exit 1
          done

  bash-syntax:
    name: Bash Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax (bash -n)
        run: |
          find . -name '*.sh' -not -path './.git/*' | while read -r script; do
            echo "Syntax-checking $script..."
            bash -n "$script" || exit 1
          done

  bats-tests:
    name: Bats Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bats
        run: |
          sudo apt-get install -y bats
      - name: Run Bats tests
        run: bats tests/*.bats

  fan-driver-tests:
    name: Fan safety and pinned driver packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mandatory Python and D-Bus test bindings
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dbus python3-gi
      - name: Fetch upstream Git objects (preparation validates the pinned commit)
        run: |
          git clone --no-checkout https://github.com/0x7375646F/Linuwu-Sense.git /tmp/linuwu-upstream
          git clone --no-checkout https://github.com/frederik-h/acer-wmi-battery.git /tmp/battery-upstream
      - name: Test mock sysfs, fan C code, exact DMI patch and packaging failures
        env:
          LINUWU_TEST_REPO: /tmp/linuwu-upstream
          BATTERY_TEST_REPO: /tmp/battery-upstream
        run: |
          set -o pipefail
          /usr/bin/python3 -m unittest discover -s tests -v 2>&1 | tee /tmp/unit.log
          ! grep -q "skipped=" /tmp/unit.log

  python-lint:
    name: Python Lint (GUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install flake8
        run: pip install flake8
      - name: Lint Python files
        run: flake8 gui/ tests/ scripts/ --max-line-length=120 --ignore=E501,W503,E402

  python-syntax:
    name: Python Syntax Check (GUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile every GUI module
        run: |
          set -e
          for f in $(find gui tests scripts -name '*.py'); do
            echo "py_compile $f"
            python -m py_compile "$f"
          done

  desktop-metadata:
    name: Desktop integration metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop entry validator
        run: sudo apt-get install -y desktop-file-utils
      - name: Validate desktop entry and D-Bus/polkit XML
        run: |
          desktop-file-validate gui/io.github.archer.desktop
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          for path in ('gui/io.otectus.Archer1.conf', 'gui/io.otectus.Archer1.policy'):
              ET.parse(path)
          PY

  gui-interactions:
    name: GTK UI and data contracts
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK test runtime
        run: pacman -Syu --noconfirm python python-gobject python-cairo python-dbus gtk4 libadwaita xorg-server-xvfb xorg-xauth dbus pipewire pipewire-audio wireplumber ffmpeg noise-suppression-for-voice
      - name: Verify the real audio filter in an isolated PipeWire server
        run: |
          useradd -m media-tester
          runuser -u media-tester -- python tests/audio_smoke.py
          runuser -u media-tester -- dbus-run-session -- python tests/session_audio.py
          runuser -u media-tester -- env SDL_AUDIODRIVER=dummy SDL_VIDEODRIVER=dummy python gui/archer_session.py speaker-test
          runuser -u media-tester -- python tests/media_pipeline.py
      - name: Check pure data contracts
        run: python tests/gui_contract_test.py
      - name: Check interactions and layouts
        run: xvfb-run -a dbus-run-session -- python tests/gui_test.py --capture
      - name: Check high contrast
        run: ARCHER_CAPTURE_DIR=/tmp/archer-ui-review/high-contrast xvfb-run -a dbus-run-session -- python tests/gui_test.py --capture --high-contrast
      - name: Check large text
        run: ARCHER_CAPTURE_DIR=/tmp/archer-ui-review/large-text xvfb-run -a dbus-run-session -- python tests/gui_test.py --capture --large-text
      - name: Upload visual review captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archer-ui-review
          path: /tmp/archer-ui-review

  native-wayland:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: GTK on native headless Wayland
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - uses: actions/checkout@v4
      - name: Run GTK under Sway
        run: |
          pacman -Syu --needed --noconfirm sway mesa dbus python python-gobject python-cairo python-dbus gtk4 libadwaita
          useradd -m gtk-tester
          runuser -u gtk-tester -- bash tests/gui-wayland.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archer-native-wayland
          path: /tmp/archer-wayland-captures

  dbus-introspect-smoke:
    name: D-Bus Introspect Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No actions/setup-python here on purpose: python3-dbus and python3-gi
      # are apt packages built against the system interpreter, and a
      # setup-python toolchain would shadow it and fail to import them.
      - name: Install D-Bus runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus dbus-x11 python3-dbus python3-gi systemd
      - name: Boot a session bus, register the service, introspect
        run: |
          # The service runs against a private session bus so CI does not
          # need root or a real system bus. We only assert that the
          # service registers, exposes Ping, GetMonitoringData, and the
          # TelemetryUpdated/AudioEnhancementChanged signals.
          dbus-run-session -- bash tests/dbus_smoke.sh

  kernel-module-build:
    name: External modules / ${{ matrix.kernel }}
    runs-on: ubuntu-latest
    container: archlinux:base
    strategy:
      fail-fast: false
      matrix:
        kernel: [linux, linux-lts, baseline-6.12, baseline-6.12.75, baseline-6.8]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools and maintained v4l2loopback source
        run: pacman -Syu --noconfirm base-devel git clang llvm dkms v4l2loopback-dkms curl pahole bc cpio gettext libelf
      - name: Install target headers
        shell: bash
        env:
          TARGET: ${{ matrix.kernel }}
        run: |
          if [[ "$TARGET" == baseline-* ]]; then
            case "$TARGET" in
              baseline-6.12)
                package=linux-lts-headers; version=6.12.73-1
                packaging_commit=cbf4e9aa8a15939687ccac9931742eba55a2a00e
                source_sha256=4059d394cbf8e9548df36d37e0b8a80c4409ac4e14ecc5019a72a770ef7b41ba
                ;;
              baseline-6.12.75)
                package=linux-lts-headers; version=6.12.75-1
                packaging_commit=dd261ee4e56028df3d1f069a0999d5be0f63ba00
                source_sha256=06ee7927556ff1aa8810c4826501b0fdb169ebdc180644b882cf7c143ac1c177
                ;;
              baseline-6.8) package=linux-headers; version=6.8.9.arch1-2 ;;
            esac
            filename="$package-$version-x86_64.pkg.tar.zst"
            fetched=0
            for archive in "https://archive.org/download/archlinux_pkg_$package" "https://archive.archlinux.org/packages/l/$package"; do
              if curl --max-time 20 -fL "$archive/$filename" -o /tmp/headers.pkg.tar.zst &&
                 curl --max-time 30 -fL "$archive/$filename.sig" -o /tmp/headers.sig &&
                 pacman-key --verify /tmp/headers.sig /tmp/headers.pkg.tar.zst; then
                fetched=1
                break
              fi
            done
            mkdir -p /tmp/baseline
            if [[ $fetched == 1 ]]; then
              tar -xf /tmp/headers.pkg.tar.zst -C /tmp/baseline
            elif [[ "$package" == linux-lts-headers ]]; then
              # Recreate a bounded, symbol-complete build tree when the Arch Linux
              # Archive is unavailable. The fallback keeps Arch's exact source and
              # API config, but disables debug data and links the providers exercised
              # by Archer into vmlinux. Its Module.symvers therefore retains strict
              # imported-symbol validation without building every Arch kernel module.
              git clone --depth 1 --branch "$version" \
                https://gitlab.archlinux.org/archlinux/packaging/packages/linux-lts.git /tmp/linux-lts-package
              [[ "$(git -C /tmp/linux-lts-package rev-parse HEAD)" == "$packaging_commit" ]]
              GNUPGHOME=/etc/pacman.d/gnupg git -C /tmp/linux-lts-package verify-tag "$version"
              kernel_version=${version%-1}
              curl --max-time 180 -fL \
                "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-$kernel_version.tar.xz" \
                -o /tmp/linux.tar.xz
              echo "$source_sha256  /tmp/linux.tar.xz" | sha256sum -c -
              tar -xf /tmp/linux.tar.xz -C /tmp/linux-lts-package
              cd "/tmp/linux-lts-package/linux-$kernel_version"
              echo -1 >localversion.10-pkgrel
              echo -lts >localversion.20-pkgname
              # Do not inherit the surrounding packaging repository's Git suffix.
              : >.scmversion
              for patch_file in ../*.patch; do patch -Np1 <"$patch_file"; done
              cp ../config .config
              scripts/config \
                --disable DEBUG_INFO \
                --enable DEBUG_INFO_NONE \
                --disable DEBUG_INFO_DWARF5 \
                --disable DEBUG_INFO_BTF \
                --disable DEBUG_INFO_BTF_MODULES \
                --enable ACPI_WMI \
                --enable INSPUR_PLATFORM_PROFILE \
                --enable ACPI_PLATFORM_PROFILE \
                --enable MEDIA_SUPPORT \
                --enable VIDEO_DEV \
                --enable VIDEOBUF2_CORE \
                --enable VIDEOBUF2_V4L2 \
                --enable VIDEOBUF2_MEMOPS \
                --enable VIDEOBUF2_VMALLOC
              make olddefconfig
              grep -qx 'CONFIG_DEBUG_INFO_NONE=y' .config
              if grep -qx 'CONFIG_DEBUG_INFO_BTF=y' .config; then echo 'Unexpected BTF in historical test configuration' >&2; exit 1; fi
              grep -qx 'CONFIG_ACPI_WMI=y' .config
              grep -qx 'CONFIG_ACPI_PLATFORM_PROFILE=y' .config
              grep -qx 'CONFIG_VIDEO_DEV=y' .config
              grep -qx 'CONFIG_VIDEOBUF2_V4L2=y' .config
              kernel_release=$(make -s kernelrelease)
              [[ "$kernel_release" == "$kernel_version-1-lts" ]]
              make modules_prepare
              make -j"$(nproc)" vmlinux
              test -s vmlinux.symvers
              cp vmlinux.symvers Module.symvers
              test -s Module.symvers
              mkdir -p "/tmp/baseline/usr/lib/modules/$kernel_release"
              ln -s "$PWD" "/tmp/baseline/usr/lib/modules/$kernel_release/build"
            else
              echo "No verified archive source for $filename" >&2
              exit 1
            fi
            echo KERNEL_MODULES_ROOT=/tmp/baseline/usr/lib/modules >> "$GITHUB_ENV"
          else
            pacman -S --noconfirm "$TARGET-headers"
            echo KERNEL_MODULES_ROOT=/usr/lib/modules >> "$GITHUB_ENV"
          fi
      - name: Compile all external modules and replay patch preparation
        run: |
          set -o pipefail
          config=$(pacman -Qlq v4l2loopback-dkms | grep '/dkms.conf$')
          for release in "$KERNEL_MODULES_ROOT"/*/build/include/config/kernel.release; do
            bash scripts/check-kernel-modules.sh "$(cat "$release")" "$(dirname "$config")" 2>&1 | tee -a /tmp/kernel-build.log
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-build-${{ matrix.kernel }}
          path: /tmp/kernel-build.log

  package-lifecycle:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install package build dependencies
        run: pacman -Syu --needed --noconfirm git python python-gobject python-dbus gtk4 libadwaita polkit python-cairo
      - uses: actions/checkout@v4
      - name: Build packages from reviewed source as an unprivileged user
        run: |
          useradd -m builder
          cp -r "$GITHUB_WORKSPACE" /home/builder/Archer
          chown -R builder:builder /home/builder/Archer
          runuser -u builder -- bash /home/builder/Archer/scripts/prepare-package.sh /tmp/package
          cd /tmp/package
          runuser -u builder -- env SOURCE_DATE_EPOCH="$(cat SOURCE_DATE_EPOCH)" makepkg
      - name: Install, verify, reinstall and remove the application
        run: |
          sed -i '/^NoExtract .*usr\/share\/doc\//d' /etc/pacman.conf
          pacman -U --noconfirm /tmp/package/*.pkg.tar.zst
          archer --version
          archer status
          archer report >/tmp/report.json
          pacman -Qkk archer-core archer-daemon archer-gui
          echo '{"schema_version":2,"lcd_override":false}' >/etc/archer/settings.json
          pacman -U --noconfirm /tmp/package/*.pkg.tar.zst
          pacman -R --noconfirm archer-gui archer-daemon archer-core
          test -f /etc/archer/settings.json
          test ! -e /usr/bin/archer
          pacman -Q >/tmp/package/installed-packages.txt
      - uses: actions/upload-artifact@v4
        with:
          name: archer-packages
          include-hidden-files: true
          path: |
            /tmp/package/.SRCINFO
            /tmp/package/SOURCE_DATE_EPOCH
            /tmp/package/*.pkg.tar.zst
            /tmp/package/*.tar.gz
            /tmp/package/PKGBUILD
            /tmp/package/installed-packages.txt

  dkms-packages:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    strategy:
      matrix:
        module: [linuwu-sense, acer-wmi-battery]
    steps:
      - name: Install DKMS package build dependencies
        run: pacman -Syu --needed --noconfirm git dkms
      - uses: actions/checkout@v4
      - name: Build the pinned DKMS package
        env:
          MODULE: ${{ matrix.module }}
        run: |
          set -eu
          useradd -m builder
          cp -r "$GITHUB_WORKSPACE" /home/builder/Archer
          chown -R builder:builder /home/builder/Archer
          runuser -u builder -- bash /home/builder/Archer/scripts/prepare-dkms-package.sh "$MODULE" /tmp/package
          cd /tmp/package
          runuser -u builder -- env SOURCE_DATE_EPOCH="$(cat SOURCE_DATE_EPOCH)" makepkg
          pacman -Qlp ./*.pkg.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.module }}-package
          include-hidden-files: true
          path: |
            /tmp/package/*.pkg.tar.zst
            /tmp/package/*.tar.gz
            /tmp/package/.SRCINFO
            /tmp/package/PKGBUILD
            /tmp/package/SOURCE_DATE_EPOCH

  rolling-variants:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: 'archlinux:base-devel', kernel: linux-zen }
          - { image: 'archlinux:base-devel', kernel: linux-hardened }
          - { image: 'cachyos/cachyos:latest', kernel: linux-cachyos }
          - { image: 'cachyos/cachyos:latest', kernel: linux-cachyos-lts }
    steps:
      - uses: actions/checkout@v4
      - name: Build external modules using the distribution repositories
        shell: bash
        env:
          KERNEL_PACKAGE: ${{ matrix.kernel }}
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm base-devel git dkms llvm clang pahole v4l2loopback-dkms "${KERNEL_PACKAGE}-headers"
          source_config=$(pacman -Qlq v4l2loopback-dkms | grep '/dkms.conf$')
          for marker in /usr/lib/modules/*/build/include/config/kernel.release; do
            bash scripts/check-kernel-modules.sh "$(cat "$marker")" "$(dirname "$source_config")"
          done
          pacman -Q >/tmp/versions.txt
      - uses: actions/upload-artifact@v4
        with:
          name: versions-${{ matrix.kernel }}
          path: /tmp/versions.txt


  package-guest:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: package-lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: archer-packages
          path: packages
      - name: Build disposable Arch guest
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/archer-vm/files"
          cp packages/*.pkg.tar.zst packages/*.tar.gz "$RUNNER_TEMP/archer-vm/files/"
          git archive --format=tar.gz --prefix=legacy/ 62e96c4d397e438c65dc5f3704e0f47ee152c649 gui lib modules scripts >"$RUNNER_TEMP/archer-vm/files/legacy-source.tar.gz"
          docker run --rm -v "$PWD:/repo:ro" -v "$RUNNER_TEMP/archer-vm:/archer-vm" archlinux:base-devel bash /repo/tests/build-package-guest.sh /archer-vm
      - name: Verify installation, reboot, camera transport and removal
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86
          cd "$RUNNER_TEMP/archer-vm"
          sudo timeout 600 qemu-system-x86_64 -accel tcg -smp 2 -m 1800 -nic none -display none -monitor none -serial stdio \
            -kernel vmlinuz -initrd initrd -append 'root=/dev/vda rw console=ttyS0 archer.package-test=1 systemd.mask=serial-getty@ttyS0.service systemd.firstboot=no systemd.mask=systemd-firstboot.service' \
            -drive file=root.ext4,format=raw,if=virtio -drive file=packages.ext4,format=raw,if=virtio,readonly=on > guest.log
          grep ARCHER_VM_LEGACY_PASS guest.log
          grep ARCHER_VM_MIGRATION_PASS guest.log
          grep ARCHER_VM_INSTALL_PASS guest.log
          grep ARCHER_VM_CAMERA_PASS guest.log
          grep ARCHER_VM_GRAPHICS_RESTORE_PASS guest.log
          grep ARCHER_VM_REBOOT_REMOVE_PASS guest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arch-guest-lifecycle
          path: ${{ runner.temp }}/archer-vm/guest.log
