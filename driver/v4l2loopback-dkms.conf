# Archer Compatibility Suite: v4l2loopback target compiler selection.
# DKMS sources this override for every build, including package-upgrade hooks.
# Use upstream's supported KERNEL_DIR target; do not patch package sources.
if grep -qs '^CONFIG_CC_IS_CLANG=y' "${kernel_source_dir}/.config"; then
    MAKE[0]="make KERNEL_DIR=${kernel_source_dir} LLVM=1 CC=clang v4l2loopback"
else
    MAKE[0]="make KERNEL_DIR=${kernel_source_dir} v4l2loopback"
fi
